<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта сайта</title>
    <link rel="stylesheet" href="styles-map.css">
</head>
<body>
    <header>
        <div class="header-content">
            <a href="index.html" class="logo-link" title="Главная">
                <img src="images/logo-akx-m.svg" alt="АКХ" class="header-logo" width="200" height="auto">
            </a>
        </div>
    </header>

    <main>
        <div class="map-container">
            <a href="gallery.html" class="map-card float-1">
                <h2>Зарисовки</h2>
            </a>
            <a href="line.html" class="map-card float-2">
                <h2>Строчки</h2>
            </a>
            <a href="note.html" class="map-card float-3">
                <h2>Архив</h2>
            </a>
        </div>
    </main>

    <footer>
        <p>© 2026 АКХ</p>
    </footer>

    <script>
        document.addEventListener('mousemove', function(e) {
            const x = (e.clientX / window.innerWidth - 0.5) * 2;
            const y = (e.clientY / window.innerHeight - 0.5) * 2;
            
            // Параллакс для фона
            document.body.style.setProperty('--bg-x', `${x * 15}px`);
            document.body.style.setProperty('--bg-y', `${y * 15}px`);
        });
    </script>
</body>
</html>
