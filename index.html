<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная</title>
    <meta name="description" content="АКХ">
    <link rel="stylesheet" href="styles-index.css">
</head>
<body>
    <main>
        <div class="parallax-wrapper">
            <!-- Задний слой с декоративной картинкой -->
            <div class="parallax-layer layer-back">
                <div class="decor-image">
                    <img src="images/mig-23-bg.svg" alt="Декоративный фон">
                </div>
            </div>
            
            <!-- Средний слой с основной гифкой -->
            <div class="parallax-layer layer-middle">
                <div class="gif-container">
                    <a href="map.html" title="Карта сайта">
                        <img src="images/logo-akx-m.svg" alt="Анимация АКХ" id="main-gif">
                    </a>
                </div>
            </div>
        </div>
    </main>
    
    <footer>
        <p>© 2026 АКХ</p>
    </footer>

    <script src="js/parallax.js"></script>
    <script src="js/custom-cursor.js"></script>
</body>
</html>
