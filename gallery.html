<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Зарисовки</title>
    <meta name="description" content="Зарисовки АКХ">
    <link rel="stylesheet" href="styles-gallery.css">
</head>
<body>
    <header>
        <div class="header-content">
            <a href="map.html" class="logo-link" title="Карта сайта">
                <img src="images/logo-akx-m.svg" alt="АКХ" class="header-logo" width="200" height="auto">
            </a>
        </div>
    </header>
    
    <main>
        <div class="gallery" id="gallery">
            <!-- Фотографии будут загружаться здесь через JavaScript -->
        </div>
    </main>
    
    <footer>
        <p>© 2026 АКХ</p>
    </footer>
    
    <script src="gallery.js"></script>

    <script>
        document.addEventListener('mousemove', function(e) {
            const x = (e.clientX / window.innerWidth - 0.5) * 2;
            const y = (e.clientY / window.innerHeight - 0.5) * 2;
            
            // Параллакс для фона
            document.body.style.setProperty('--bg-x', `${x * 15}px`);
            document.body.style.setProperty('--bg-y', `${y * 15}px`);
            
            document.querySelector('.layer-back').style.transform = `translate(${x * 25}px, ${y * 25}px)`;
            document.querySelector('.layer-middle').style.transform = `translate(${x * 0}px, ${y * 0}px)`;
        });
    </script>
</body>
</html>
